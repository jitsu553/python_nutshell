name: python_nutshell

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fast_api_postgres
    attach: false
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fast_api_redis
    attach: false
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: fast_api_ollama
    attach: false
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: fast_api_ollama_pull
    attach: false
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama-models.txt:/models.txt:ro
    entrypoint: ["/bin/sh", "-c", "grep -v '^[[:space:]]*\\(#\\|$$\\)' /models.txt | while read -r m; do ollama pull \"$$m\" || exit 1; done"]
    restart: "no"

  mcp-server:
    build: .
    container_name: fast_api_mcp
    env_file:
      - .env
    ports:
      - "${MCP_SERVER_PORT:-8100}:${MCP_SERVER_PORT:-8100}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "-m", "app.mcp_server.server"]
    restart: unless-stopped

  api:
    build: .
    container_name: fast_api_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mcp-server:
        condition: service_started
    volumes:
      - ./:/app
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  ollama_data:
    external: true