apiVersion: v1
kind: Pod
metadata:
  name: api-pod
  labels:
    app: api
spec:
  restartPolicy: Always
  initContainers:
    - name: wait-for-postgres
      image: busybox:1.36
      command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      # command: ["sh", "-c", "echo starting; exit 1"]
  containers:
    - name: api
      image: nutshell-api:0.1
      imagePullPolicy: Never
      ports:
        - containerPort: 8000
      env:
        - name: DATABASE_URL
          value: postgresql+psycopg://postgres:postgres@postgres:5432/fastapi_db
        - name: SECRET_KEY
          value: dev-only-not-a-secret